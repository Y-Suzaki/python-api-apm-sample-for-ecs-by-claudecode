[project]
name = "python-api-apm-sample-for-ecs-by-claudecode"
version = "0.1.0"
description = "FastAPI backend with user management on AWS ECS Fargate + DynamoDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # 外部 HTTP API 呼び出し用（/configuration エンドポイント）。
    "httpx>=0.27.0",
    # --- OpenTelemetry (CloudWatch Agent サイドカー → AWS Application Signals) ---
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-botocore>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-sdk-extension-aws>=2.0.2",
    "opentelemetry-propagator-aws-xray>=1.0.1",
    # AWS Application Signals 用の Distro。TracerProvider / MeterProvider に
    # AWS 固有の SpanProcessor / MetricExporter を装着する役割を持つ。
    # opentelemetry-instrument 経由起動時に自動発火する Configurator を、
    # app/core/telemetry.py から明示的に呼び出して使う。
    "aws-opentelemetry-distro>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
