AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB users table. Partition key is email.

Parameters:
  ProjectName:
    Type: String
    Default: py-apm-sample
  TableName:
    Type: String
    Default: users

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  UsersTableName:
    Value: !Ref UsersTable
    Export:
      Name: !Sub ${ProjectName}-UsersTableName
  UsersTableArn:
    Value: !GetAtt UsersTable.Arn
    Export:
      Name: !Sub ${ProjectName}-UsersTableArn
