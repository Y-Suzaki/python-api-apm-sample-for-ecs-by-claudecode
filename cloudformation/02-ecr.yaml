AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository for the FastAPI container image.

Parameters:
  ProjectName:
    Type: String
    Default: py-apm-sample

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}/api
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub ${ProjectName}-EcrRepoUri
  RepositoryName:
    Value: !Ref Repository
    Export:
      Name: !Sub ${ProjectName}-EcrRepoName
